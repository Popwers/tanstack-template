# Local dev stack: Postgres 18 (same major as the shared production server) + Mailpit.
# The app runs on the host (`make dev`) so HMR stays fast.
#   Mailpit UI: http://localhost:8025
name: ${COMPOSE_PROJECT_NAME:-tanstack-template}

services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
            POSTGRES_DB: ${POSTGRES_DB:-app}
        # 5432 is often taken by another local Postgres.
        ports:
            - '${POSTGRES_PORT:-5434}:5432'
        # Postgres 18+ keeps data in a versioned subdir: mount the parent.
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 2s
            timeout: 5s
            retries: 30

    mailpit:
        image: axllent/mailpit:v1.27
        restart: unless-stopped
        ports:
            - '8025:8025'
            - '1025:1025'

volumes:
    pgdata:
