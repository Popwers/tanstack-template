name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Conformity
        run: bun scripts/conformity.ts
      - name: Check (lint + fmt + typecheck)
        run: bun --bun vp check
      - name: Unit tests
        run: bun --bun vp test run
      - name: Install Chromium for e2e
        run: bunx e2e-web install chromium --with-deps
      - name: e2e (deterministic tests only)
        run: bun run test:e2e:ci
      - name: e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: .e2e/
          include-hidden-files: true
          retention-days: 7
      - name: Docker build
        run: docker build -t app:ci .
