name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `prepare` installs Git hooks; semantic-release commits and pushes, so keep them out.
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
